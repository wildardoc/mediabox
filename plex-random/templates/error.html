<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Random Player - Error</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .error-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }
        h1 { color: #e94560; margin-bottom: 20px; }
        p { color: #ccc; line-height: 1.6; }
        .error-details {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            text-align: left;
            word-break: break-all;
        }
        a {
            color: #e94560;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Connection Error</h1>
        <p>Unable to connect to Plex Media Server. Please check that:</p>
        <ul style="text-align: left; color: #ccc;">
            <li>Plex is running</li>
            <li>PLEX_URL is correct</li>
            <li>PLEX_TOKEN is valid</li>
        </ul>
        <div class="error-details">{{ error }}</div>
        <p style="margin-top: 20px;"><a href="/">Try again</a></p>
    </div>
</body>
</html>
